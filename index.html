<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grzyby — live</title>
<style>
  :root {
    --bg:#08110a; --card:#10231a; --edge:#2f5d36; --edge2:#3f7a48;
    --lime:#aed581; --amber:#ffb74d; --red:#ef5350; --blue:#42a5f5;
    --txt:#d7e8cf; --mut:#7f9a80;
  }
  * { box-sizing:border-box; }
  body {
    background:radial-gradient(ellipse at top,#0d1f13,#040805);
    color:var(--txt); font-family:'Poppins','Segoe UI',sans-serif;
    margin:0; padding:24px; min-height:100vh;
  }
  h1 { margin:0 0 8px; font-size:24px; color:var(--lime); letter-spacing:.5px; font-weight:700; }
  #bar { font-size:12px; color:var(--mut); margin-bottom:22px; display:flex;
         align-items:center; gap:10px; flex-wrap:wrap; }
  .live { display:inline-block; width:9px; height:9px; background:#4caf50;
          border-radius:50%; box-shadow:0 0 8px #4caf50; animation:p 1.4s infinite; }
  .live.off { background:#666; box-shadow:none; animation:none; }
  @keyframes p { 50% { opacity:.35; } }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px;
           background:rgba(0,0,0,.5); border:1px solid var(--edge); font-size:11px; }

  .section-header {
    margin:32px 0 16px; display:flex; align-items:center; gap:14px;
  }
  .section-header .title {
    font-size:15px; font-weight:700; color:var(--amber);
    text-transform:uppercase; letter-spacing:1.6px;
    padding:6px 14px; border-radius:8px;
    background:linear-gradient(180deg,rgba(255,183,77,.15),rgba(255,183,77,.05));
    border:1px solid rgba(255,183,77,.35);
  }
  .section-header .count {
    font-size:12px; color:var(--mut); font-weight:600;
  }
  .section-header .line {
    flex:1; height:1px; background:linear-gradient(90deg,rgba(255,183,77,.3),transparent);
  }

  /* ─── PIONOWE (portrait) karty ─── */
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:16px;
    margin-bottom:8px;
  }
  @media (min-width:1400px) { .grid { grid-template-columns:repeat(5, 1fr); } }
  @media (max-width:520px)  { .grid { grid-template-columns:repeat(2, 1fr); gap:10px; } }

  .card {
    background:linear-gradient(180deg,var(--card),#08110a);
    border:1px solid var(--edge); border-top:4px solid var(--edge);
    border-radius:14px; padding:18px 14px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:10px; transition:transform .15s, box-shadow .25s;
    min-height:280px;
  }
  .card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.55); }
  .card.alive   { border-color:#4caf50; border-top-color:#4caf50; box-shadow:0 0 18px rgba(76,175,80,.15); }
  .card.warn    { border-color:#ef5350; border-top-color:#ef5350; box-shadow:0 0 18px rgba(239,83,80,.2); }
  .card.respawn { border-color:#42a5f5; border-top-color:#42a5f5; }
  .card.ready   { border-color:#ce93d8; border-top-color:#ce93d8; box-shadow:0 0 18px rgba(206,147,216,.2); }
  .card.picked  { border-color:#546e7a; border-top-color:#546e7a; opacity:.65; }
  .card.rumor   { border-color:#42a5f5; border-top-color:#42a5f5; opacity:.85; }

  .card img {
    width:88px; height:88px; image-rendering:pixelated; flex-shrink:0;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  .name {
    font-size:14px; font-weight:700; color:#e8f5e9; line-height:1.25;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; min-height:36px;
    align-items:center; justify-content:center;
  }
  .lvl-tag {
    display:inline-block; padding:2px 9px; font-size:11px;
    border-radius:6px; background:rgba(255,183,77,.15); color:#ffb74d;
    border:1px solid rgba(255,183,77,.35); font-weight:700;
  }

  .cat {
    font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--mut); padding:3px 9px; border-radius:6px;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.06);
  }
  .card.alive   .cat { color:#66bb6a; border-color:rgba(102,187,106,.35); background:rgba(76,175,80,.1); }
  .card.warn    .cat { color:#ef5350; border-color:rgba(239,83,80,.4); background:rgba(239,83,80,.1); }
  .card.respawn .cat { color:#64b5f6; border-color:rgba(100,181,246,.4); background:rgba(66,165,245,.1); }
  .card.ready   .cat { color:#ce93d8; border-color:rgba(206,147,216,.4); background:rgba(206,147,216,.1); }
  .card.picked  .cat { color:#607d8b; }
  .card.rumor   .cat { color:#64b5f6; }

  .loc {
    font-size:11px; color:var(--mut); line-height:1.4;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; min-height:30px;
  }
  .loc b { color:#c5e1a5; font-weight:600; }

  .timer-big {
    font-family:'Courier New',monospace; font-size:32px; font-weight:800;
    color:var(--lime); line-height:1; letter-spacing:1px;
    margin-top:auto; padding-top:8px;
  }
  .card.warn    .timer-big { color:#ef5350; }
  .card.respawn .timer-big { color:#64b5f6; }
  .card.ready   .timer-big { color:#ce93d8; }
  .card.picked  .timer-big { color:#808080; }

  .sub-txt { font-size:10.5px; color:var(--mut); letter-spacing:.4px; }
  .sub-txt.strong { color:#c5e1a5; font-weight:600; font-size:12px; }

  .empty {
    grid-column:1/-1; color:#4a5a4b; font-size:13px; padding:24px;
    text-align:center; background:rgba(0,0,0,.25); border-radius:10px;
    font-style:italic; border:1px dashed var(--edge);
  }

  .target-card {
    background:linear-gradient(180deg,rgba(60,120,40,.25),rgba(30,70,20,.1));
    border:1px solid #8bc34a; border-radius:12px; padding:16px 18px;
    display:flex; flex-direction:column; gap:6px; margin-bottom:14px;
  }
  .target-card .name { font-size:15px; text-align:left; -webkit-line-clamp:1; min-height:auto; }
  .target-card .meta { font-size:12px; color:var(--mut); text-align:left; }
  .target-card .meta b { color:#c5e1a5; }

  .queue-wrap { margin-bottom:18px; }
  .queue-label { font-size:11px; color:var(--mut); margin-bottom:8px;
                 text-transform:uppercase; letter-spacing:1px; font-weight:600; }
  .chip { display:inline-block; padding:5px 12px; border-radius:999px;
          background:rgba(124,179,66,.12); border:1px solid var(--edge2);
          font-size:12px; margin:0 6px 6px 0; }
  .chip b { color:var(--lime); }

  footer { margin-top:40px; font-size:10px; color:#4a5a4b; text-align:center; }
</style>
</head>
<body>

<h1>Grzyby — live</h1>
<div id="bar">
  <span id="dot" class="live off"></span>
  <span id="status">łączę z Firebase…</span>
</div>

<div id="target"></div>
<div id="queue" class="queue-wrap"></div>

<div id="sections"></div>

<footer id="foot"></footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const TOKEN = '42262d1f-c60d-477c-a30c-2e4c6fcc781a';

const app = initializeApp({
    databaseURL: 'https://grzyby-fe1e7-default-rtdb.europe-west1.firebasedatabase.app'
});
const db = getDatabase(app);

let state = null;
let lastUpdate = 0;
const STALE_MS = 20_000;

function fmt(ms) {
    if (ms == null || ms <= 0) return '0:00';
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    if (h > 0) return `${h}h ${String(Math.floor((s%3600)/60)).padStart(2,'0')}m`;
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function fmtClock(ts) {
    if (!ts) return '--:--';
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

function renderCard(t, now) {
    const short = (t.type || '').replace(/^Ogromn\S+\s/, '');
    const lvlTag = t.level ? `<span class="lvl-tag">${t.level} lvl</span>` : '';
    let cls, mainTxt, subTxt, cat, extraTxt = '';

    if (t.state === 'seen') {
        const left = Math.max(0, (t.expiresAt || now) - now);
        mainTxt = fmt(left);
        if (t.picked) {
            cls='picked'; cat='Zebrany'; subTxt='timer leci dalej';
        } else if (t.source === 'chat') {
            cls='rumor'; cat='Pogłoska'; subTxt='czekam na detektor';
        } else if (left < 60_000) {
            cls='warn'; cat='Zaraz zniknie'; subTxt='zniknie o';
            extraTxt = fmtClock(t.expiresAt);
        } else {
            cls='alive'; cat='Aktywny'; subTxt='zniknie o';
            extraTxt = fmtClock(t.expiresAt);
        }
    } else {
        const toMin = t.respawnMin ? t.respawnMin - now : 0;
        const toMax = t.respawnMax ? t.respawnMax - now : 0;
        if (toMin > 0) {
            cls='respawn'; cat='Respawn'; mainTxt=fmt(toMin);
            subTxt='okno'; extraTxt = `${fmtClock(t.respawnMin)} – ${fmtClock(t.respawnMax)}`;
        } else if (toMax > 0) {
            cls='ready'; cat='Może się pojawić'; mainTxt='?';
            subTxt='do'; extraTxt = fmtClock(t.respawnMax);
        } else {
            cls='picked'; cat='Po oknie'; mainTxt='—'; subTxt='sprawdź mapę';
        }
    }

    const loc = t.locMap ? `<b>${esc(t.locMap)}</b> (${t.locX}, ${t.locY})` : '—';
    const img = t.img ? `<img src="${esc(t.img)}" alt="">` : '<div style="width:88px;height:88px;"></div>';

    return `<div class="card ${cls}">
        ${img}
        <div class="name">${esc(short)}</div>
        <div>${lvlTag}</div>
        <div class="cat">${cat}</div>
        <div class="loc">${loc}</div>
        <div class="sub-txt">${subTxt}</div>
        <div class="sub-txt strong">${extraTxt || '—'}</div>
        <div class="timer-big">${mainTxt}</div>
    </div>`;
}

function renderSections() {
    const now = Date.now();
    const timers = state?.timers || [];
    const lvl100 = timers.filter(t => (t.level || 0) < 150);
    const lvl200 = timers.filter(t => (t.level || 0) >= 150);

    const sectionsEl = document.getElementById('sections');

    const sortFn = (a, b) => {
        const la = a.state === 'seen' ? (a.expiresAt || now) - now : (a.respawnMin || now) - now;
        const lb = b.state === 'seen' ? (b.expiresAt || now) - now : (b.respawnMin || now) - now;
        return la - lb;
    };

    const makeSection = (title, list) => {
        const cardsHtml = list.length
            ? list.slice().sort(sortFn).map(t => renderCard(t, now)).join('')
            : `<div class="empty">Brak aktywnych timerów</div>`;
        return `
            <div class="section-header">
                <span class="title">${title}</span>
                <span class="count">${list.length} ${list.length === 1 ? 'grzyb' : 'grzybów'}</span>
                <span class="line"></span>
            </div>
            <div class="grid">${cardsHtml}</div>
        `;
    };

    let html = '';
    html += makeSection('100 lvl', lvl100);
    html += makeSection('200 lvl', lvl200);

    if (!lvl100.length && !lvl200.length) {
        html = `<div class="empty" style="margin-top:20px;">Brak aktywnych timerów — bot nie wykrył jeszcze żadnego grzyba</div>`;
    }

    sectionsEl.innerHTML = html;
}

function renderTargetAndQueue() {
    const tEl = document.getElementById('target');
    const qEl = document.getElementById('queue');

    if (state?.target) {
        const t = state.target;
        const phases = { approach:'Podejście', dialog:'Rozmowa', farming:'Zbiory', skarbiec:'Skarbiec' };
        tEl.innerHTML = `<div class="target-card">
            <div class="cat" style="color:#aed581;text-align:left;">Aktualny cel</div>
            <div class="name">${esc(t.name)}</div>
            <div class="meta">Lokalizacja: <b>${esc(t.map)} (${t.x}, ${t.y})</b> &nbsp;·&nbsp; Faza: <b style="color:#aed581;">${phases[t.phase] || t.phase}</b></div>
        </div>`;
    } else {
        tEl.innerHTML = '';
    }

    if (state?.queue?.length) {
        qEl.innerHTML = `<div class="queue-label">W kolejce (${state.queue.length})</div>
            ${state.queue.map(q => `<span class="chip"><b>${esc((q.name||'').replace(/^Ogromn\S+\s/,''))}</b> @ ${esc(q.map)}</span>`).join('')}`;
    } else {
        qEl.innerHTML = '';
    }
}

function renderBar() {
    const now = Date.now();
    const stale = now - lastUpdate > STALE_MS;
    const dot = document.getElementById('dot');
    const st = document.getElementById('status');
    dot.className = 'live' + (stale ? ' off' : '');
    if (!state) { st.textContent = 'czekam na dane z userscriptu…'; return; }
    const ago = Math.round((now - lastUpdate) / 1000);
    st.innerHTML =
        `<b style="color:#c5e1a5;">${esc(state.nick || '?')}</b> · ` +
        `${esc(state.map || '?')} (${state.x}, ${state.y}) · ` +
        `lvl ${state.level || '?'} · ` +
        `<span class="badge">${state.grzEnabled ? 'ON' : 'OFF'}</span> ` +
        `<span class="badge">${state.isRunning ? 'biega' : 'stop'}</span> ` +
        `· update ${ago}s temu`;
}

function render() {
    renderBar();
    renderTargetAndQueue();
    renderSections();
    document.getElementById('foot').textContent =
        'Margonem Radar · ' + new Date().toLocaleString();
}

const stateRef = ref(db, `mushrooms/${TOKEN}`);
onValue(stateRef, (snap) => {
    const val = snap.val();
    if (!val) { state = null; render(); return; }
    state = val;
    lastUpdate = Date.now();
    render();
}, (err) => {
    console.error('FB err:', err);
    document.getElementById('status').textContent = 'Błąd Firebase: ' + err.message;
});

setInterval(render, 1000);
</script>
</body>
</html>
